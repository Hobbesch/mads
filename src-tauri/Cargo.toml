[package]
name = "mads"
version = "0.1.0"
description = "mads — multi-agent development surface"
authors = ["Hobbesch"]
edition = "2021"

[lib]
name = "mads_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Datei-Explorer (docs/design/07-file-explorer.md): ignore-aware Dir-Walk,
# content-hash für das Conflict-Signal, base64 für Binär-/Bild-Payloads.
ignore = "0.4"
sha2 = "0.10"
base64 = "0.22"
